ミーチャム","job":"戦士","prejob":"君主","trait":"捨て子"},{"race":"ピグミーチャム","job":"戦士","prejob":"僧侶","trait":"天使に祝福されし者"},{"race":"ピグミーチャム","job":"賢者","prejob":"修道者","trait":"賢聖の家系"},{"race":"ピグミーチャム","job":"剣聖","prejob":"戦士","trait":"隠遁者の知識"}],"note":"魔性の最終戦で撤退戦を行うための編成。最大限の時短と運勢も考慮している。 レア10.0倍と5600もの罠解除能力が必要になる。さらに、カンスト宝石の直接ドロップを狙うためにできる限り称号倍率も高めておきたい。 なお、中級以上の宝石のドロップ率は約0.5%。掘り出し化までは長い長い道のりになる。"},{"cat":"育成","prog":"川沿い","name":"編成例","members":[{"race":"吸血鬼","job":"忍者","prejob":"ロイヤルライン","trait":"竜に育てられし者"},{"race":"ドラゴニュート","job":"剣士","prejob":"戦士","trait":"竜に育てられし者"},{"race":"ドワーフ","job":"戦士","prejob":"僧侶","trait":"捨て子"},{"race":"人間女","job":"修道者","prejob":"ロイヤルライン","trait":"エリート"},{"name":"(育成枠1)"},{"name":"(育成枠2)"}],"note":"GP稼ぎの効率も良いため、金策面をある程度カバーしている。 アイテム獲得率もある程度カバーしているため、剣士や育成枠の代わりにピグミーチャム盗賊を起用しても良い。"},{"cat":"育成","prog":"魔獣の森","name":"編成例","members":[{"race":"ドラゴニュート","job":"戦士マスター","prejob":"","trait":"竜に育てられし者"},{"race":"吸血鬼","job":"忍者","prejob":"ロイヤルライン","trait":"竜に育てられし者"},{"race":"人間女","job":"修道者","prejob":"ロイヤルライン","trait":"エリート"},{"race":"人間女","job":"僧侶","prejob":"ロイヤルライン","trait":"エリート"},{"name":"(育成枠1)"},{"name":"(育成枠2)"}],"note":"僧侶の救出を想定した編成。回避重視の忍者であれば道中の攻撃のほぼ全てを回避できる。 ボスの銀狼は高い命中と弱者狙いを持つため、育成枠のレベルが低い内は途中帰還した方が効率が良くなりやすい。"},{"cat":"育成","prog":"ノーム領","name":"編成例1","members":[{"race":"鬼","job":"剣聖","prejob":"忍者","trait":"古武術習得"},{"race":"タロス","job":"君主マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"},{"name":"(育成枠3)"},{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"(不問)"}],"note":"先制殲滅に賭ける編成。魔性以上ではエギル・ガギルの罵倒のせいで完全な安定こそ望めないものの、育成パーティの全滅は失うものが少ないためあまり気にならない。 ヴィヴィアン・マーシュの手記報酬で「投擲用の臭い貯金箱」を入手後は、5列目に修道者、6列目に剣聖とを配置することで罵倒の被弾率が下がり安定度が増す。 また、ドロップ品の質が良いため育成枠を削ってトレハン能力を高めても良い。その場合は、良品の魔道書の入手率を高めるために称号付与率を重視しておきたい。"},{"cat":"育成","prog":"ノーム領","name":"編成例2","members":[{"race":"鬼","job":"剣聖","prejob":"忍者","trait":"古武術習得"},{"race":"アンデッドマン","job":"盗賊マスター","prejob":"","trait":"天使に祝福されし者"},{"race":"タロス","job":"君主","prejob":"戦士","trait":""},{"race":"ノーム","job":"僧侶","prejob":"賢者","trait":"賢聖の家系"},{"name":"(育成枠)"},{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"エリート"}],"note":"同時にトレハンを行うための編成。特に戦術に変更は無いが、少し火力が低下している点には留意しておきたい。 タロスはトレハンスキルの確保のために追加で基礎強化の改造を施しておく。また、キリンが手に入り次第アンデッドマンと入れ替えたい。"},{"cat":"育成","prog":"クロノス神殿","name":"編成例","members":[{"race":"フライング ソード","job":"戦士マスター","prejob":"","trait":""},{"race":"吸血鬼","job":"忍者","prejob":"ロイヤルライン","trait":"竜に育てられし者"},{"race":"( キリン )","job":"(忍者)","prejob":"(侍)","trait":""},{"race":"エルフ","job":"君主","prejob":"僧侶","trait":"天使に祝福されし者"},{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"エリート"},{"race":"ノーム","job":"僧侶","prejob":"賢者","trait":"賢聖の家系"},{"name":"(育成枠)"}],"note":"フライングソードのパリィに期待した編成。育成枠は少ないものの、そこそこのトレハン能力も持つ。 ボスのクロノス兵は総合力が高いため、当面は途中帰還した方が効率が良くなりやすい。"},{"cat":"育成","prog":"ギルド防衛戦","name":"編成例1","members":[{"race":"鬼","job":"剣聖","prejob":"忍者","trait":"古武術習得"},{"race":"ピグミーチャム","job":"秘法剣士マスター","prejob":"","trait":"騎士の家系"},{"race":"ハッピーラビット","job":"修道者マスター","prejob":"","trait":""},{"race":"タロス","job":"君主マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"}],"note":"ノーム領と同様の先制殲滅型の編成。基本的には1周目の伝説に限定した運用になるが、宿ったでも従来の伝説のノーム領の編成と同程度の育成効率(罵倒の影響を含む)は見込める。 剣聖が秘法剣士に先行した場合にはまず間違いなく全滅するが、その頻度はノーム領と比べれば遥かにマシである…と言うよりそんな事態(約0.02%)はほぼ発生しない。 伝説の安定周回には一通りのレア細剣とレア刀が必要になるだけでなく、皆殺しの剣と神器交換宝石の最初の魔性のモルガナイトと偽装されし伝説のクンツァイトも必要になる。 「偽装されし」は海底神殿や帝都特攻などの重要な迷宮の周回に必須の超レア"},{"cat":"育成","prog":"ギルド防衛戦","name":"編成例2","members":[{"race":"ピグミーチャム","job":"剣聖","prejob":"忍者","trait":"古武術習得"},{"race":"ピグミーチャム","job":"忍者マスター","prejob":"","trait":"古武術習得"},{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"賢聖の家系"},{"race":"タロス ハッピーラビット","job":"君主マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"}],"note":"ピグミーチャム同士の行動順調整で100％の行動順安定と最大限の時短を考慮した編成。火力さえ十分であれば非常に安定して周回することができる。 伝説を安定して周回するためには一通りのレア細剣とレア刀に皆殺しの剣が必要になる。 また、恐ろしいの安定周回には相当数の超レアが必要であるため、多くの場合2周目(魔性)クリアからしばらく経ってからの運用開始になる。"},{"cat":"育成","prog":"ギルド防衛戦 2周目(魔性)クリア後","name":"編成例","members":[{"race":"サイキック","job":"忍者","prejob":"戦士","trait":"賢聖の家系"},{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"賢聖の家系"},{"race":"ハッピーラビット","job":"僧侶マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"},{"name":"(育成枠3)"}],"note":"ニュークリア強化装備が揃っていることを前提とした先制殲滅型の編成。必要な超レアが少ない(+40%魔法威力を2つ、１つは主を欺くが必須)ため、他のパーティの編成に与える影響が小さい。 最低限の火力があれば討ち漏らした際も炎術師の攻撃(ほぼダメージを受けない物理攻撃or火力の低いファイヤーボール)しか受けないため、全滅のリスクを負うことなく周回することができる。 また、育成枠を削ってロイヤルマスターを起用しても良い。君主がいないため中々の収入になる。"},{"cat":"育成","prog":"ギルド防衛戦 伝説のバベルの塔制覇後","name":"編成例1","members":[{"race":"ピグミーチャム","job":"剣聖","prejob":"忍者","trait":"魔法の知識"},{"race":"ピグミーチャム","job":"忍者マスター","prejob":"","trait":"古武術習得"},{"race":"ハッピーラビット","job":"修道者マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"},{"name":"(育成枠3)"}],"note":"ピグミーチャム同士の行動順調整で100％の行動順安定と最大限の時短を考慮した編成。君主マスターの指揮とアタックアップが無くなったことで火力が2.4分の1になり、周回の難度は非常に高くなっている。 育成効率は「育成枠3の伝説<育成枠2の恐ろしい」になるため、基本的には恐ろしいでの育成に限定した運用になる。 クローン細胞と進化の書を利用すれば安定して周回することができるが、必要な超レアの数は非常に多い。"},{"cat":"育成","prog":"ギルド防衛戦 伝説のバベルの塔制覇後","name":"編成例2","members":[{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"賢聖の家系"},{"race":"ピグミーチャム","job":"忍者マスター","prejob":"","trait":"賢聖の家系"},{"race":"ハッピーラビット","job":"僧侶マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"},{"name":"(育成枠3)"}],"note":"ピグミーチャム同士の行動順調整で100％の行動順安定と最大限の時短を考慮した魔法型の編成。 必要な超レアこそ少ないものの、実質的にソロモンの指輪またはカンスト宝石が必須の贅沢な編成となっている。"},{"cat":"育成","prog":"ギルド防衛戦 伝説のバベルの塔制覇後","name":"番外ネタ ソロモンの指輪PT","members":[{"race":"ピグミーチャム","job":"修道者マスター","prejob":"","trait":"賢聖の家系"},{"race":"ハッピーラビット","job":"忍者マスター","prejob":"","trait":""},{"name":"(育成枠1)"},{"name":"(育成枠2)"},{"name":"(育成枠3)"},{"name":"(育成枠4)"}],"note":"ソロモンの指輪の[Lv倍]その他装備を利用した最高の育成効率を誇る編成。魔法結界の上から凄まじい火力のニュークリアを撃ち込んで先制殲滅する。 必須超レアは少ないが、最早そんなことはどうでも良くなるほどカンスト宝石を湯水の如く使う必要がある。"}];
const byId=new Map(items.map(i=>[i.id,i])),monsterByName=new Map(monsters.map(m=>[m.name,m])),chapters=[...new Set(items.flatMap(i=>i.drops.map(d=>d.chapter)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
chapters.forEach(ch=>chapterFilter.insertAdjacentHTML('beforeend',`<option value="${esc(ch)}">${esc(ch)}</option>`));
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function drops(i){return i.drops.filter(d=>(!chapterFilter.value||d.chapter===chapterFilter.value)&&(!difficultyFilter.value||d.difficulty===difficultyFilter.value))}
function render(){const q=query.value.trim().toLowerCase(),groups=new Map();items.forEach(i=>{const ds=drops(i);if(!ds.length)return;const hay=[i.name,...ds.flatMap(d=>[d.dungeon,d.monster,d.chapter])].join(' ').toLowerCase();if(q&&!hay.includes(q))return;ds.forEach(d=>{const key=d.dungeonOrder;if(!groups.has(key))groups.set(key,{order:key,name:d.dungeon,chapter:d.chapter,items:new Map()});if(!groups.get(key).items.has(i.id))groups.get(key).items.set(i.id,i)})});const gs=[...groups.values()].sort((a,b)=>a.order-b.order);count.textContent=`${gs.length}ヶ所`;empty.hidden=gs.length>0;list.innerHTML=gs.map(g=>`<section class="dungeon-section"><div class="dungeon-title"><span class="dungeon-chapter">${esc(g.chapter)}</span>${esc(g.name)}</div>${[...g.items.values()].map(i=>{const ds=drops(i).filter(d=>d.dungeonOrder===g.order),diffs=[...new Set(ds.map(d=>d.difficulty))];return `<button class="item-card" data-id="${i.id}"><span class="item-top"><span class="item-name">${i.marker?`<span class="marker">${esc(i.marker)}</span>`:''}${esc(i.name)}</span></span><span class="item-tags">${diffs.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</span><span class="chevron">›</span></button>`}).join('')}</section>`).join('');list.querySelectorAll('.item-card').forEach(c=>c.addEventListener('click',()=>detail(byId.get(Number(c.dataset.id))))) }
function fmtEffect(raw){var str=String(raw||"").trim();if(!str)return "";var bi=str.indexOf("[");var flat=(bi<0?str:str.slice(0,bi)).trim();var rest=bi<0?"":str.slice(bi);var stats=[];if(flat){flat.split(/\s+/).forEach(function(tok){if(!tok)return;var m=tok.match(/^(.*?)([+\-]?\d[\d.]*%?)$/);if(m&&m[1])stats.push([m[1],m[2]]);else stats.push([tok,""]);});}var effs=[];if(rest){var re=/\[([^\]]*)\]\s*([^\[]*)/g,mm;while((mm=re.exec(rest))){var v=mm[1].replace(/\s+/g," ").trim().replace(/(\d) (?=\d)/g,"$1").replace(/ %/g,"%").replace(/ 倍/g,"倍");var l=mm[2].replace(/\s+/g," ").trim();if(v||l)effs.push([v,l]);}}var html="";if(stats.length){html+="<table class=\"stat-table\">"+stats.map(function(r){var v=r[1],c="";if(/^-/.test(v))c=" class=\"neg\"";else if(/^\+/.test(v))c=" class=\"pos\"";return "<tr><th>"+esc(r[0])+"</th><td"+c+">"+esc(v)+"</td></tr>";}).join("")+"</table>";}if(effs.length){html+="<ul class=\"eff-list\">"+effs.map(function(r){return "<li><span class=\"eff-val\">"+esc(r[0])+"</span><span class=\"eff-lab\">"+esc(r[1])+"</span></li>";}).join("")+"</ul>";}if(!html)html="<div class=\"effect\">"+esc(str)+"</div>";return html;}

window.monsterDetail = function(m) {

  const order = ['通常','魔性','宿った','伝説','その他'];
  const dropHtml = [...groups.entries()].sort((a,b) => order.indexOf(a[0])-order.indexOf(b[0])).map(([difficulty, rows]) => `<div class="monster-drop-group"><div class="monster-drop-heading">${esc(difficulty)}</div>${rows.map(d => `<div class="monster-drop-row"><strong>${esc(d.item)}</strong><span>${esc(d.dungeon)}<br>罠難易度：${esc(d.trap)}</span></div>`).join('')}</div>`).join('');

(() => {

    title.setAttribute('role', 'button'); title.setAttribute('tabindex', '0');

    return ms.map(x => {
      if (x.name) return '<tr class="build-npc"><td colspan="4">' + esc(x.name) + '</td></tr>';
      const RACES = ['\u4eba\u9593\u7537','\u4eba\u9593\u5973','\u30d4\u30b0\u30df\u30fc\u30c1\u30e3\u30e0','\u30ce\u30fc\u30e0','\u30c9\u30ef\u30fc\u30d5','\u30c0\u30fc\u30af\u30a8\u30eb\u30d5','\u5438\u8840\u9b3c','\u30a8\u30eb\u30d5','\u30b5\u30a4\u30ad\u30c3\u30af','\u30ef\u30fc\u30ad\u30e3\u30c3\u30c8','\u30c9\u30e9\u30b4\u30cb\u30e5\u30fc\u30c8','\u30a2\u30de\u30be\u30cd\u30b9','\u9b54\u9020\u751f\u7269','\u30a2\u30f3\u30c7\u30c3\u30c9\u30de\u30f3','\u5de8\u4eba','\u5929\u72d7','\u9b3c','\u30b5\u30a4\u30dc\u30fc\u30b0'];
      const isMon = typeof monsterByName !== 'undefined' && monsterByName.has(x.race) && RACES.indexOf(x.race) < 0;
      const rc = isMon ? '<span class="build-mlink" data-mon="' + esc(x.race) + '">' + esc(x.race) + '</span>' : esc(x.race || '\u2014');
      return '<tr><td>' + rc + '</td><td>' + esc(x.job || '\u2014') + '</td><td>' + esc(x.prejob || '\u2014') + '</td><td>' + esc(x.trait || '\u2014') + '</td></tr>';
    }).join('');
  }
  function renderBuilds() {
    const c = catSel.value, p = progSel.value;
    const f = builds.filter(b => (!c || b.cat === c) && (!p || b.prog === p));
    const pill = document.getElementById('resultCount');
    if (pill) pill.textContent = f.length + '\u4ef6';
    emptyEl.hidden = f.length > 0;
    listEl.innerHTML = f.map(b => {
      const key = b.cat + '\u0000' + b.prog + '\u0000' + b.name;
      const collapsed = bOpen.has(key) ? '' : ' is-collapsed';
      return '<section class="dungeon-section' + collapsed + '"><div class="dungeon-title" role="button" tabindex="0"><span class="dungeon-chapter">' + esc(b.cat) + '\u30fb' + esc(b.prog) + '</span>' + esc(b.name) + '</div>' +
        '<table class="build-table"><tr class="build-head"><td>' + HEAD + '</td><td>' + H2 + '</td><td>' + H3 + '</td><td>' + H4 + '</td></tr>' + memberRows(b.members) + '</table>' +
        (b.note ? '<p class="build-note">' + esc(b.note) + '</p>' : '') +
        '</section>';
    }).join('');
    listEl.querySelectorAll('.dungeon-section').forEach((sec, i) => {
      const b = f[i]; if (!b) return;
      const key = b.cat + '\u0000' + b.prog + '\u0000' + b.name;
      const title = sec.querySelector('.dungeon-title');
      const toggle = () => {
        const open = sec.classList.toggle('is-collapsed') === false;
        open ? bOpen.add(key) : bOpen.delete(key);
        title.setAttribute('aria-expanded', String(open));
      };
      title.setAttribute('aria-expanded', String(!sec.classList.contains('is-collapsed')));
      title.addEventListener('click', toggle);
      title.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });
  }
  listEl.addEventListener('click', e => {
    const sp = e.target.closest('.build-mlink'); if (!sp) return;
    const m = typeof monsterByName !== 'undefined' && monsterByName.get(sp.dataset.mon);
    if (m && window.monsterDetail) { window.monsterDetail(m); const d = document.getElementById('detailDialog'); if (d && !d.open) d.showModal(); }
  });
  catSel.addEventListener('change', () => { syncProg(); renderBuilds(); });
  progSel.addEventListener('change', renderBuilds);
  (window.__mainViews || (window.__mainViews = {})).builds = { el: view, render: renderBuilds };
  syncProg();
})();

</script></body></html>
