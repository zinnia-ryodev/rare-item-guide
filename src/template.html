.dungeon-title{cursor:pointer;position:relative;padding-right:42px}.dungeon-title::after{content:'⌃';position:absolute;right:15px;top:50%;font-size:20px;transform:translateY(-55%);color:#6366f1}.dungeon-section.is-collapsed .dungeon-title::after{content:'⌄'}.dungeon-section.is-collapsed>:not(.dungeon-title){display:none}

op:1px solid var(--line);padding:6px 7px;vertical-align:top;line-height:1.4}.build-table tr:first-child td{border-top:0}.build-head td{color:var(--muted);font-weight:700;font-size:11px}.build-npc td{text-align:center;font-weight:800;background:#f1f5f9;color:#1e1b4b}.build-mlink{color:#4338ca;font-weight:700;cursor:pointer;border-bottom:1px dotted #4338ca}.build-note{font-size:12px;color:#475569;line-height:1.65;margin:0;padding:0 2px 4px}#buildsView .filter-row{margin-top:0}.monster-card{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 15px;cursor:pointer}.monster-card strong{display:block;font-size:15px}.monster-card small{display:block;color:var(--muted);font-size:12px;margin-top:5px}.monster-drops{display:flex;flex-wrap:wrap;gap:6px}

<body>
  <header class="app-header"><div class="header-inner"><div><p class="eyebrow">冒険者ギルド物語2</p><h1>レアアイテム検索</h1></div><span class="count-pill" id="resultCount">—</span></div></header>
  <main class="container">
    <section class="search-card" aria-label="検索条件">
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="アイテム名・モンスター名で検索" autocomplete="off"><button id="clearQuery" class="clear-button" type="button" aria-label="検索語を消去">×</button></label>
      <div class="filter-row"><select id="chapterFilter" aria-label="章で絞り込み"><option value="">すべての章</option></select><select id="difficultyFilter" aria-label="難易度で絞り込み"><option value="">すべての難易度</option><option>通常</option><option>魔性</option><option>宿った</option><option>伝説</option></select></div>
      <div class="owned-tools"><select id="ownedFilter" aria-label="入手状態で絞り込み"><option value="all">入手状態：すべて</option><option value="unowned">未入手のみ</option><option value="owned">入手済みのみ</option></select><button id="exportOwned" type="button">チェックを書き出す</button><button id="importOwned" type="button">読み込む</button><input id="ownedFile" type="file" accept="application/json" hidden></div>
    </section>
    <div class="section-heading"><h2 id="listHeading">ダンジョン一覧</h2><button id="resetFilters" class="text-button" type="button">条件をリセット</button></div>
    <section id="itemList" class="item-list" aria-live="polite"></section><p id="emptyState" class="empty-state" hidden>条件に一致するアイテムがありません。</p>
  </main>
  <dialog id="detailDialog"><div class="dialog-shell"><button id="closeDialog" class="dialog-close" type="button" aria-label="閉じる">×</button><div id="detailContent"></div></div></dialog>
  
<script>
window.__META=/*@DATA:META@*/;
window.RARE_ITEMS=/*@DATA:RARE_ITEMS@*/;
window.RARE_MONSTERS=/*@DATA:RARE_MONSTERS@*/;
window.PARTY_RECS=/*@DATA:PARTY_RECS@*/;

/* 4章以降はwikiに重要度★表が無いため本文から抽出した暫定リスト。★表が追加されたらこの1行を削除してsqlite再取り込みするだけでよい。 */
window.PARTY_RECS=window.PARTY_RECS.concat(/*@DATA:PARTY_RECS_PROSE@*/);const items=window.RARE_ITEMS,monsters=window.RARE_MONSTERS||[],$=id=>document.getElementById(id),query=$('query'),chapterFilter=$('chapterFilter'),difficultyFilter=$('difficultyFilter'),list=$('itemList'),empty=$('emptyState'),count=$('resultCount'),dialog=$('detailDialog');
window.PARTY_BUILDS=/*@DATA:PARTY_BUILDS@*/;
window.TREH_CHECK=/*@DATA:TREH_CHECK@*/;
const byId=new Map(items.map(i=>[i.id,i])),monsterByName=new Map(monsters.map(m=>[m.name,m])),chapters=[...new Set(items.flatMap(i=>i.drops.map(d=>d.chapter)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja',{numeric:true}));
chapters.forEach(ch=>chapterFilter.insertAdjacentHTML('beforeend',`<option value="${esc(ch)}">${esc(ch)}</option>`));
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function drops(i){return i.drops.filter(d=>(!chapterFilter.value||d.chapter===chapterFilter.value)&&(!difficultyFilter.value||d.difficulty===difficultyFilter.value))}
function render(){const q=query.value.trim().toLowerCase(),groups=new Map();items.forEach(i=>{const ds=drops(i);if(!ds.length)return;const hay=[i.name,...ds.flatMap(d=>[d.dungeon,d.monster,d.chapter])].join(' ').toLowerCase();if(q&&!hay.includes(q))return;ds.forEach(d=>{const key=d.dungeonOrder;if(!groups.has(key))groups.set(key,{order:key,name:d.dungeon,chapter:d.chapter,items:new Map()});if(!groups.get(key).items.has(i.id))groups.get(key).items.set(i.id,i)})});const gs=[...groups.values()].sort((a,b)=>a.order-b.order);count.textContent=`${gs.length}ヶ所`;empty.hidden=gs.length>0;list.innerHTML=gs.map(g=>`<section class="dungeon-section"><div class="dungeon-title"><span class="dungeon-chapter">${esc(g.chapter)}</span>${esc(g.name)}</div>${[...g.items.values()].map(i=>{const ds=drops(i).filter(d=>d.dungeonOrder===g.order),diffs=[...new Set(ds.map(d=>d.difficulty))];return `<button class="item-card" data-id="${i.id}"><span class="item-top"><span class="item-name">${i.marker?`<span class="marker">${esc(i.marker)}</span>`:''}${esc(i.name)}</span></span><span class="item-tags">${diffs.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</span><span class="chevron">›</span></button>`}).join('')}</section>`).join('');list.querySelectorAll('.item-card').forEach(c=>c.addEventListener('click',()=>detail(byId.get(Number(c.dataset.id))))) }
function fmtEffect(raw){var str=String(raw||"").trim();if(!str)return "";var bi=str.indexOf("[");var flat=(bi<0?str:str.slice(0,bi)).trim();var rest=bi<0?"":str.slice(bi);var stats=[];if(flat){flat.split(/\s+/).forEach(function(tok){if(!tok)return;var m=tok.match(/^(.*?)([+\-]?\d[\d.]*%?)$/);if(m&&m[1])stats.push([m[1],m[2]]);else stats.push([tok,""]);});}var effs=[];if(rest){var re=/\[([^\]]*)\]\s*([^\[]*)/g,mm;while((mm=re.exec(rest))){var v=mm[1].replace(/\s+/g," ").trim().replace(/(\d) (?=\d)/g,"$1").replace(/ %/g,"%").replace(/ 倍/g,"倍");var l=mm[2].replace(/\s+/g," ").trim();if(v||l)effs.push([v,l]);}}var html="";if(stats.length){html+="<table class=\"stat-table\">"+stats.map(function(r){var v=r[1],c="";if(/^-/.test(v))c=" class=\"neg\"";else if(/^\+/.test(v))c=" class=\"pos\"";return "<tr><th>"+esc(r[0])+"</th><td"+c+">"+esc(v)+"</td></tr>";}).join("")+"</table>";}if(effs.length){html+="<ul class=\"eff-list\">"+effs.map(function(r){return "<li><span class=\"eff-val\">"+esc(r[0])+"</span><span class=\"eff-lab\">"+esc(r[1])+"</span></li>";}).join("")+"</ul>";}if(!html)html="<div class=\"effect\">"+esc(str)+"</div>";return html;}
function detail(item){const ds=drops(item),info=item.details||[];const detailHtml=info.length?`<h3 class="detail-heading">性能・基本情報</h3>${info.map(x=>`<div class="detail-info"><div class="detail-label">${esc(x.section||x.category||'アイテム情報')}</div>${x.restrictions?`<div class="restriction">${esc(x.restrictions)}</div>`:''}${x.effect?fmtEffect(x.effect):''}${x.price?`<div class="price">価格：${esc(x.price)}</div>`:''}${x.note?`<div class="detail-note">${esc(x.note)}</div>`:''}</div>`).join('')}`:'';$('detailContent').innerHTML=`<div class="detail-title">${item.marker?`<span class="marker">${esc(item.marker)}</span>`:''}${esc(item.name)}</div>${detailHtml}<div class="detail-grid"><div class="detail-stat"><small>入手情報</small>${ds.length}件</div><div class="detail-stat"><small>ダンジョン</small>${new Set(ds.map(d=>d.dungeon)).size}ヶ所</div><div class="detail-stat"><small>難易度</small>${[...new Set(ds.map(d=>d.difficulty))].join('・')||'—'}</div></div><h3 class="detail-heading">入手場所・ドロップモンスター</h3>${ds.map(d=>`<div class="drop-row"><div class="drop-dungeon">${esc(d.dungeon)}<br><span class="tag">${esc(d.difficulty)}</span></div><div class="drop-info">罠難易度：${esc(d.trap)}<br>${d.monster?`<button class="monster-link" data-monster="${esc(d.monster)}" type="button">${esc(d.monster)}　›</button>`:'—'}</div></div>`).join('')}${item.url?`<a class="wiki-link" href="${esc(item.url)}" target="_blank" rel="noopener">Wikiでアイテム詳細を見る ↗</a>`:''}`;dialog.showModal();dialog.querySelectorAll('.monster-link').forEach(b=>b.addEventListener('click',()=>monsterDetail(monsterByName.get(b.dataset.monster))))}

window.monsterDetail = function(m) {

  const order = ['通常','魔性','宿った','伝説','その他'];
  const dropHtml = [...groups.entries()].sort((a,b) => order.indexOf(a[0])-order.indexOf(b[0])).map(([difficulty, rows]) => `<div class="monster-drop-group"><div class="monster-drop-heading">${esc(difficulty)}</div>${rows.map(d => `<div class="monster-drop-row"><strong>${esc(d.item)}</strong><span>${esc(d.dungeon)}<br>罠難易度：${esc(d.trap)}</span></div>`).join('')}</div>`).join('');

(() => {
  const KEY = 'guildmono2-dungeon-open-v1';

    const title = section.querySelector('.dungeon-title');
    if (!title) return;
    const key = `${title.textContent.trim()}`;
    section.dataset.collapseReady = '1';
    section.classList.toggle('is-collapsed', !open.has(key));
    title.setAttribute('role', 'button'); title.setAttribute('tabindex', '0');
    title.setAttribute('aria-expanded', String(open.has(key)));

      title.setAttribute('aria-expanded', String(willOpen));
      willOpen ? open.add(key) : open.delete(key); save();
    };
    title.addEventListener('click', toggle);
    title.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });

})();

(() => {
  if (!window.__setMainView || !Array.isArray(window.TREH_CHECK)) return;
  const main = document.querySelector('main.container');
  const tabs = main && main.querySelector('.mode-tabs');
  if (!main || !tabs) return;
  const KEY = 'guildmono2-treh-check';
  let done = new Set();
  try { done = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mode-tab'; btn.dataset.view = 'check';
  btn.textContent = 'トレハン確認';
  tabs.appendChild(btn);

  const view = document.createElement('section');
  view.id = 'checkView'; view.hidden = true;
  view.innerHTML =
    '<p class="guide-lead">wiki「トレハン・金策パーティー」のトレハン効果一覧。今のギルドで<b>用意できる手段</b>にチェック。端末内に保存されます。</p>' +
    '<div id="checkList"></div>';
  main.appendChild(view);
  const listEl = view.querySelector('#checkList');
  const cOpen = new Set(window.TREH_CHECK.map((_, i) => i));

  function key(ci, ri) { return ci + ':' + ri; }
  function renderCheck() {
    let total = 0, got = 0;
    window.TREH_CHECK.forEach(c => c.rows.forEach(() => total++));
    done.forEach(() => got++);
    const pill = document.getElementById('resultCount');
    if (pill) pill.textContent = got + '/' + total;
    listEl.innerHTML = window.TREH_CHECK.map((c, ci) => {
      const n = c.rows.length;
      const g = c.rows.filter((_, ri) => done.has(key(ci, ri))).length;
      const collapsed = cOpen.has(ci) ? '' : ' is-collapsed';
      const rows = c.rows.map((r, ri) => {
        const k = key(ci, ri), on = done.has(k);
        return '<label class="check-row' + (on ? ' check-done' : '') + '">' +
          '<input type="checkbox" data-k="' + k + '"' + (on ? ' checked' : '') + '>' +
          '<span class="check-val">' + esc(r.val) + '</span>' +
          '<span class="check-src">' + esc(r.src) + (r.note ? '<span class="check-note">' + esc(r.note) + '</span>' : '') + '</span>' +
          '</label>';
      }).join('');
      return '<section class="dungeon-section' + collapsed + '"><div class="dungeon-title" role="button" tabindex="0"><span class="dungeon-chapter">' + g + ' / ' + n + '</span>' + esc(c.cat) + '</div>' + rows + '</section>';
    }).join('');
    listEl.querySelectorAll('.dungeon-section').forEach((sec, ci) => {
      const title = sec.querySelector('.dungeon-title');
      const toggle = () => {
        const open = sec.classList.toggle('is-collapsed') === false;
        open ? cOpen.add(ci) : cOpen.delete(ci);
        title.setAttribute('aria-expanded', String(open));
      };
      title.setAttribute('aria-expanded', String(!sec.classList.contains('is-collapsed')));
      title.addEventListener('click', toggle);
      title.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    });
  }
  listEl.addEventListener('change', e => {
    const cb = e.target.closest('input[data-k]'); if (!cb) return;
    cb.checked ? done.add(cb.dataset.k) : done.delete(cb.dataset.k);
    save();
    const row = cb.closest('.check-row'); if (row) row.classList.toggle('check-done', cb.checked);
    const pill = document.getElementById('resultCount');
    let total = 0; window.TREH_CHECK.forEach(c => c.rows.forEach(() => total++));
    if (pill) pill.textContent = done.size + '/' + total;
    const sec = cb.closest('.dungeon-section');
    if (sec) {
      const ci = [...listEl.children].indexOf(sec);
      const c = window.TREH_CHECK[ci];
      const g = c.rows.filter((_, ri) => done.has(key(ci, ri))).length;
      const chap = sec.querySelector('.dungeon-chapter');
      if (chap) chap.textContent = g + ' / ' + c.rows.length;
    }
  });
  (window.__mainViews || (window.__mainViews = {})).check = { el: view, render: renderCheck };
})();


(() => {
  if (!window.__setMainView || typeof monsterByName === 'undefined') return;
  const main = document.querySelector('main.container');
  const tabs = main && main.querySelector('.mode-tabs');
  if (!main || !tabs) return;
  const mons = (window.RARE_MONSTERS || []).slice();

  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'mode-tab'; btn.dataset.view = 'monsters';
  btn.textContent = 'モンスター';
  tabs.appendChild(btn);

  const RACE_SET = ['人型', '不死', '神魔', '中位神魔', '竜族', '魔物'];
  const races = RACE_SET.filter(r => mons.some(m =>
    ((m.profile && m.profile.race) === r) || (m.locations || []).some(l => l.race === r)));

  const view = document.createElement('section');
  view.id = 'monstersView'; view.hidden = true;
  view.innerHTML =
    '<div class="search-card" style="margin-bottom:12px">' +
    '<label class="search-box"><span aria-hidden="true">⌕</span>' +
    '<input id="monQuery" type="search" placeholder="モンスター名・ドロップ品・迷宮で検索" autocomplete="off">' +
    '<button id="monClear" class="clear-button" type="button" aria-label="消去">×</button></label>' +
    '<div class="filter-row" style="margin-top:9px">' +
    '<select id="monRace"><option value="">すべての種族</option>' + races.map(r => '<option>' + esc(r) + '</option>').join('') + '</select>' +
    '<select id="monSort"><option value="name">名前順</option><option value="drops">ドロップ数順</option><option value="hp">HP順</option></select>' +
    '</div></div>' +
    '<div id="monList" class="mon-list item-list"></div>' +
    '<p id="monEmpty" class="empty-state" hidden>該当するモンスターがいません。</p>';
  main.appendChild(view);

  const q = view.querySelector('#monQuery');
  const raceSel = view.querySelector('#monRace');
  const sortSel = view.querySelector('#monSort');
  const listEl = view.querySelector('#monList');
  const emptyEl = view.querySelector('#monEmpty');

  const raceOf = m => {
    const p = m.profile && m.profile.race;
    if (RACE_SET.includes(p)) return p;
    const fromLoc = [...new Set((m.locations || []).map(l => l.race).filter(r => RACE_SET.includes(r)))];
    return fromLoc.join('・') || '—';
  };
  const numHp = m => { const n = parseInt((m.profile || {}).hp, 10); return isNaN(n) ? -1 : n; };

  function render() {
    const term = q.value.trim().toLowerCase();
    const rf = raceSel.value;
    let f = mons.filter(m => {
      if (rf && !raceOf(m).split('・').includes(rf) && !((m.locations || []).some(l => l.race === rf))) return false;
      if (!term) return true;
      if (m.name.toLowerCase().includes(term)) return true;
      if ((m.drops || []).some(d => (d.item || '').toLowerCase().includes(term))) return true;
      if ((m.locations || []).some(l => (l.dungeon || '').toLowerCase().includes(term))) return true;
      return false;
    });
    const s = sortSel.value;
    if (s === 'drops') f.sort((a, b) => (b.drops || []).length - (a.drops || []).length || a.name.localeCompare(b.name, 'ja'));
    else if (s === 'hp') f.sort((a, b) => numHp(b) - numHp(a) || a.name.localeCompare(b.name, 'ja'));
    else f.sort((a, b) => a.name.localeCompare(b.name, 'ja'));

    const pill = document.getElementById('resultCount');
    if (pill) pill.textContent = f.length + '体';
    emptyEl.hidden = f.length > 0;
    listEl.innerHTML = f.map(m => {
      const loc = (m.locations || []).length, dr = (m.drops || []).length;
      const hp = (m.profile || {}).hp;
      const sub = esc(raceOf(m)) + ' ・ 出現' + loc + 'ヶ所 ・ ドロップ' + dr + '件' + (hp ? ' ・ HP' + esc(hp) : '');
      return '<button class="monster-card" type="button" data-mon="' + esc(m.name) + '">' +
        '<span class="item-top"><strong>' + esc(m.name) + '</strong><small>' + sub + '</small></span>' +
        '<span class="chevron">›</span></button>';
    }).join('');
  }

  listEl.addEventListener('click', e => {
    const b = e.target.closest('[data-mon]'); if (!b) return;
    const m = monsterByName.get(b.dataset.mon);
    if (m && window.monsterDetail) {
      window.monsterDetail(m);
      const d = document.getElementById('detailDialog');
      if (d && !d.open) d.showModal();
    }
  });
  q.addEventListener('input', render);
  raceSel.addEventListener('change', render);
  sortSel.addEventListener('change', render);
  view.querySelector('#monClear').addEventListener('click', () => { q.value = ''; q.focus(); render(); });

  (window.__mainViews || (window.__mainViews = {})).monsters = { el: view, render };
})();

</script></body></html>
